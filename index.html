function backupData(){

document.getElementById("menuPopup").style.display="none";

let backup = {

students: students,

appPin: localStorage.getItem("appPin")

};

let data = JSON.stringify(backup,null,2);

let blob = new Blob([data],{
type:"application/json"
});

let url = URL.createObjectURL(blob);

let a = document.createElement("a");

let today = new Date();

let fileName =
"Tuition_Backup_" +
today.getFullYear() + "-" +
String(today.getMonth()+1).padStart(2,"0") + "-" +
String(today.getDate()).padStart(2,"0") +
".json";

a.href = url;

a.download = fileName;

a.click();

URL.revokeObjectURL(url);

alert("Backup Created Successfully");

}

function restoreData(){

document.getElementById("menuPopup").style.display="none";

document.getElementById("restoreFile").click();

}
function restoreBackup(event){

let file = event.target.files[0];

if(!file) return;

let reader = new FileReader();

reader.onload = function(e){

try{

let backup = JSON.parse(e.target.result);

if(!backup.students){

alert("Invalid Backup File");

return;

}

students = backup.students;

localStorage.setItem(
"tuitionData",
JSON.stringify(students)
);

if(backup.appPin){

localStorage.setItem(
"appPin",
backup.appPin
);

}else{

localStorage.removeItem(
"appPin"
);

}

render();

if(localStorage.getItem("appPin")){

document.getElementById("lockSwitch").checked=true;

}else{

document.getElementById("lockSwitch").checked=false;

}

alert("Backup Restored Successfully");

}catch{

alert("Invalid Backup File");

}

document.getElementById("restoreFile").value="";

};

reader.readAsText(file);

}

}  
}

    localStorage.getItem("tuitionData");  
  if(saved){
students = JSON.parse(saved);
students.forEach(s => {
if(!s.fees){
s.fees = [];
}
});

render();
if(localStorage.getItem("appPin")){

).checked = true;
